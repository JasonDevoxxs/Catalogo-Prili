<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurações — Admin</title>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<div class="admin-layout">

  <aside id="sidebar">
    <div class="sidebar-logo">
      <img src="../assets/logo.png" alt="Logo" onerror="this.style.display='none'">
      <span id="sb-nome">Admin</span>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html"   class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span>Dashboard</span></a>
      <a href="produtos.html"    class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg><span>Produtos</span></a>
      <a href="categorias.html"  class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg><span>Categorias</span></a>
      <a href="configuracoes.html" class="nav-item ativo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Configurações</span></a>
    </nav>
    <div class="sidebar-footer">
      <button id="btn-logout"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span>Sair</span></button>
    </div>
  </aside>

  <div class="admin-main">
    <div class="admin-topbar">
      <span class="page-title">Configurações</span>
      <span class="topbar-user" id="user-email"></span>
    </div>
    <div class="admin-content">
      <form id="form-config" style="max-width:600px">

        <div class="card-tabela" style="margin-bottom:1.5rem">
          <div class="tabela-header"><h2>Dados da loja</h2></div>
          <div style="padding:1.5rem">
            <div class="form-grupo">
              <label for="cfg-nome">Nome da loja</label>
              <input id="cfg-nome" class="form-input" type="text" placeholder="Ex: Pastelaria da Maria">
            </div>
            <div class="form-grupo">
              <label for="cfg-whatsapp">WhatsApp (só números, com DDI+DDD)</label>
              <input id="cfg-whatsapp" class="form-input" type="text" placeholder="5511999999999">
            </div>
            <div class="form-grupo">
              <label for="cfg-horario">Horário de funcionamento</label>
              <input id="cfg-horario" class="form-input" type="text" placeholder="Seg a Sex 10h–22h, Sáb/Dom 10h–23h">
            </div>
            <div class="form-grupo">
              <label for="cfg-logo-url">URL do logo</label>
              <input id="cfg-logo-url" class="form-input" type="url" placeholder="https://…">
            </div>
          </div>
        </div>

        <div class="card-tabela" style="margin-bottom:1.5rem">
          <div class="tabela-header"><h2>Visibilidade</h2></div>
          <div style="padding:1.5rem;display:flex;flex-direction:column;gap:.85rem">
            <label style="display:flex;align-items:center;gap:.6rem;cursor:pointer;font-size:.9rem">
              <input type="checkbox" id="cfg-aberto"> Loja aberta (exibe "Aberto" no header)
            </label>
            <label style="display:flex;align-items:center;gap:.6rem;cursor:pointer;font-size:.9rem">
              <input type="checkbox" id="cfg-manutencao"> Modo manutenção (exibe banner de aviso)
            </label>
            <label style="display:flex;align-items:center;gap:.6rem;cursor:pointer;font-size:.9rem">
              <input type="checkbox" id="cfg-carrinho"> Carrinho ativado
            </label>
            <label style="display:flex;align-items:center;gap:.6rem;cursor:pointer;font-size:.9rem">
              <input type="checkbox" id="cfg-precos"> Mostrar preços
            </label>
            <label style="display:flex;align-items:center;gap:.6rem;cursor:pointer;font-size:.9rem">
              <input type="checkbox" id="cfg-favoritos"> Permitir favoritos no catálogo
            </label>
            <label style="display:flex;align-items:center;gap:.6rem;cursor:pointer;font-size:.9rem">
              <input type="checkbox" id="cfg-detalhes"> Exibir detalhes ao selecionar um produto
            </label>
          </div>
        </div>

        <button type="submit" class="btn btn-primario">Salvar configurações</button>
      </form>
    </div>
  </div>
</div>

<div id="toast-admin"></div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  import CONFIG from '../js/config.js';
  const supabase = createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey);

  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { location.href = 'index.html'; }
  document.getElementById('user-email').textContent = session.user.email;
  document.getElementById('sb-nome').textContent = CONFIG.nomeLoja || 'Admin';
  document.getElementById('btn-logout').addEventListener('click', async () => { await supabase.auth.signOut(); location.href = 'index.html'; });

  /* ---- CARREGAR ---- */
  const { data } = await supabase.from('configuracoes').select('chave, valor');
  const cfg = Object.fromEntries((data || []).map(r => [r.chave, r.valor]));

  document.getElementById('cfg-nome').value        = cfg.nome_loja || '';
  document.getElementById('cfg-whatsapp').value    = cfg.whatsapp || '';
  document.getElementById('cfg-horario').value     = cfg.horario_texto || '';
  document.getElementById('cfg-logo-url').value    = cfg.logo_url || '';
  document.getElementById('cfg-aberto').checked    = cfg.horario_aberto === 'true';
  document.getElementById('cfg-manutencao').checked = cfg.modo_manutencao === 'true';
  document.getElementById('cfg-carrinho').checked  = cfg.carrinho_ativo !== 'false';
  document.getElementById('cfg-precos').checked    = cfg.mostrar_precos !== 'false';
  document.getElementById('cfg-favoritos').checked = cfg.favoritos_ativos !== 'false';
  document.getElementById('cfg-detalhes').checked  = cfg.detalhes_produto_ativos !== 'false';

  /* ---- SALVAR ---- */
  document.getElementById('form-config').addEventListener('submit', async e => {
    e.preventDefault();
    const pares = [
      { chave: 'nome_loja',       valor: document.getElementById('cfg-nome').value.trim() },
      { chave: 'whatsapp',        valor: document.getElementById('cfg-whatsapp').value.trim() },
      { chave: 'horario_texto',   valor: document.getElementById('cfg-horario').value.trim() },
      { chave: 'logo_url',        valor: document.getElementById('cfg-logo-url').value.trim() },
      { chave: 'horario_aberto',  valor: String(document.getElementById('cfg-aberto').checked) },
      { chave: 'modo_manutencao', valor: String(document.getElementById('cfg-manutencao').checked) },
      { chave: 'carrinho_ativo',  valor: String(document.getElementById('cfg-carrinho').checked) },
      { chave: 'mostrar_precos',  valor: String(document.getElementById('cfg-precos').checked) },
      { chave: 'favoritos_ativos', valor: String(document.getElementById('cfg-favoritos').checked) },
      { chave: 'detalhes_produto_ativos', valor: String(document.getElementById('cfg-detalhes').checked) },
    ];

    const { error } = await supabase.from('configuracoes').upsert(pares, { onConflict: 'chave' });
    if (error) toast('Erro: ' + error.message, 'erro');
    else toast('Configurações salvas!', 'sucesso');
  });

  function toast(msg, tipo = '') {
    const el = document.getElementById('toast-admin');
    el.textContent = msg; el.className = `visivel ${tipo}`;
    clearTimeout(el._t); el._t = setTimeout(() => el.className = '', 2500);
  }
</script>
</body>
</html>
